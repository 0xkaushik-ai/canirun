[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canirun-llm"
version = "0.2.0"
description = "Can your machine run that LLM? Memory, best quant, and tokens/sec in seconds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["llm", "gguf", "llama.cpp", "vram", "quantization", "local-llm"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13",
    "psutil>=5.9",
    "numpy>=1.24",
    "huggingface_hub>=0.23",
    "nvidia-ml-py>=12; platform_system != 'Darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
canirun = "canirun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["canirun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
